<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NZI Architectes · Book 2026</title>
<meta name="description" content="NZI Architectes Urbanistes, Paris. Book 2026.">
<meta property="og:title" content="NZI Architectes · Book 2026">
<meta property="og:image" content="pages/p001.jpg">
<style>
@font-face{font-family:AC;src:url(fonts/ArchivoCondensed-Medium.ttf);font-weight:500}
@font-face{font-family:AC;src:url(fonts/ArchivoCondensed-ExtraBold.ttf);font-weight:800}
@font-face{font-family:AC;src:url(fonts/ArchivoCondensed-Light.ttf);font-weight:300}
:root{--ink:#1A1A1A;--paper:#fff;--ratio:1131/1600}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font:500 14px/1.2 AC,"Arial Narrow",sans-serif;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--ink);background:var(--paper);z-index:3}
header h1{font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
header h1 span{font-weight:300}
header .sp{flex:1}
select,a.dl,button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--ink);height:32px;padding:0 12px;border-radius:0;cursor:pointer}
a.dl{display:inline-flex;align-items:center;text-decoration:none;font-weight:800;background:var(--ink);color:var(--paper)}
#cpt{font-variant-numeric:tabular-nums;white-space:nowrap;min-width:84px;text-align:right}
main{position:fixed;top:52px;bottom:56px;left:0;right:0;display:flex;align-items:center;justify-content:center;padding:18px}
.spread{display:flex;height:100%;max-width:100%;align-items:center;justify-content:center}
.pg{height:100%;aspect-ratio:var(--ratio);max-width:50%;background:var(--paper) center/contain no-repeat;outline:1px solid var(--ink);position:relative}
.single .pg{max-width:100%}
.pg.blank{outline:none}
.pg.l::after{content:"";position:absolute;top:0;bottom:0;right:0;width:18px;background:linear-gradient(to left,rgba(0,0,0,.10),transparent)}
.pg.r::after{content:"";position:absolute;top:0;bottom:0;left:0;width:18px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent)}
.zone{position:fixed;top:52px;bottom:56px;width:50%;z-index:2;cursor:pointer}
#prevZ{left:0;cursor:w-resize}#nextZ{right:0;cursor:e-resize}
footer{position:fixed;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-top:1px solid var(--ink);background:var(--paper);z-index:3}
footer input{flex:1;accent-color:var(--ink)}
footer button{width:44px;font-size:18px;font-weight:800}
@media (max-width:700px){header h1 span,.lab{display:none} header{gap:10px;padding:0 12px} select{max-width:120px} main{padding:8px}}
</style></head>
<body>
<header><h1>NZI Architectes <span>· Book 2026</span></h1><span class="sp"></span>
<select id="go" aria-label="Aller à"><option value="">Aller à…</option><option value="1">Couverture</option><option value="2">L'agence</option><option value="4">Prix</option><option value="5">Publications</option><option value="8">Conférences</option><option value="11">Sommaire</option><option value="12">01  Transformations</option><option value="118">02  Mixtes</option><option value="158">03  Découvrir, travailler, apprendre</option><option value="214">04  Habiter</option><option value="326">Bâtiments livrés</option><option value="327">Contacts</option></select>
<span id="cpt"></span>
<a class="dl" href="NZI_Book_2026.pdf" download>Télécharger<span class="lab">&nbsp;le PDF (32 Mo)</span></a></header>
<main><div class="spread" id="sp"></div></main>
<div class="zone" id="prevZ"></div><div class="zone" id="nextZ"></div>
<footer><button id="prev" aria-label="Page précédente">‹</button>
<input type="range" id="sl" min="1" max="328" value="1" aria-label="Page">
<button id="next" aria-label="Page suivante">›</button></footer>
<script>
const N=328;let p=1;
const src=i=>'pages/p'+String(i).padStart(3,'0')+'.jpg';
const dbl=()=>innerWidth>innerHeight*1.05&&innerWidth>700;
// en double page : 1 seule, puis (2,3), (4,5)…, la dernière seule si paire
const first=i=>dbl()?(i<=1?1:(i%2?i-1:i)):i;
function show(i){
  p=Math.max(1,Math.min(N,first(i)));
  const sp=document.getElementById('sp');sp.innerHTML='';
  let pages=[p];
  if(dbl()&&p>1&&p<N)pages=[p,p+1];
  sp.className='spread'+(pages.length==1?' single':'');
  if(dbl()&&p==1)pages=[0,1];
  if(dbl()&&p==N&&N%2==0)pages=[N,0];
  pages.forEach((k,j)=>{const d=document.createElement('div');
    d.className='pg'+(k?'':' blank')+(pages.length==2?(j?' r':' l'):'');
    if(k)d.style.backgroundImage='url('+src(k)+')';sp.appendChild(d);});
  if(dbl()&&(p==1||p==N))sp.className='spread';
  const vis=pages.filter(Boolean);
  document.getElementById('cpt').textContent=vis.join('–')+' / '+N;
  document.getElementById('sl').value=p;
  history.replaceState(null,'','#'+p);
  [1,2,3,4].forEach(k=>{[p+k,p-k].forEach(q=>{if(q>=1&&q<=N)new Image().src=src(q);});});
}
const step=d=>show(dbl()?(d>0?(p==1?2:p+2):(p<=3?1:p-2)):p+d);
document.getElementById('prev').onclick=document.getElementById('prevZ').onclick=()=>step(-1);
document.getElementById('next').onclick=document.getElementById('nextZ').onclick=()=>step(1);
document.getElementById('sl').oninput=e=>show(+e.target.value);
document.getElementById('go').onchange=e=>{if(e.target.value)show(+e.target.value);e.target.value='';};
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='PageDown'||e.key==' ')step(1);
  if(e.key=='ArrowLeft'||e.key=='PageUp')step(-1);if(e.key=='Home')show(1);if(e.key=='End')show(N);});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)step(dx<0?1:-1);x0=null;});
addEventListener('resize',()=>show(p));
addEventListener('hashchange',()=>{const h=parseInt(location.hash.slice(1));if(h&&h!==p)show(h);});
show(parseInt(location.hash.slice(1))||1);
</script></body></html>
